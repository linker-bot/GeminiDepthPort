name: Offline checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      matrix:
        python: ['3.10', '3.12', '3.13']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Install test dependencies
        run: python -m pip install -r requirements-test.txt
      - name: Unit tests without camera hardware
        run: python -m unittest discover -s tests -v
      - name: Python and JavaScript syntax
        run: |
          python -m compileall -q driver_build.py configuration.py generation.py lifecycle.py operation_guard.py cameractl.py deployment_control.py web_server.py scripts runtime tests
          node --check web/app.js
      - name: Shell syntax
        run: bash -n deploy.sh runtime/entrypoint.sh
      - name: Compose schema
        env:
          ORBBEC_DEPLOY_DIR: ${{ github.workspace }}
        run: |
          docker compose --profile cameras config --quiet
          python tests/check_generated_compose.py
  web-container:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Build Web management image
        run: docker build -f web.Dockerfile -t geminidepthport-web:ci .
      - name: Run as checkout owner, without Docker socket or device access
        run: |
          docker run --rm --network none --read-only --cap-drop ALL --tmpfs /tmp \
            --user "$(id -u):$(id -g)" \
            -v "$PWD:$PWD:rw" -w "$PWD" \
            -e ORBBEC_CONTAINERIZED=1 -e ORBBEC_DEPLOY_DIR="$PWD" \
            -e HOME=/tmp/home -e DOCKER_CONFIG=/tmp/docker \
            geminidepthport-web:ci python3 tests/smoke_web_container.py

  native-driver-build:
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Build pinned official driver and run synthetic SDK/ROS checks
        run: |
          upstream=$(python3 -c "import driver_build; print(driver_build.patch_identity()['upstream_commit'])")
          patch_digest=$(python3 -c "import driver_build; print(driver_build.patch_identity()['patch_sha256'])")
          docker build --build-arg "ORBBEC_COMMIT=$upstream" --build-arg "YUYV_PATCH_SHA256=$patch_digest" -t geminidepthport-native-yuyv:ci .
      - name: Repeat synthetic ROS and preview checks without network or device access
        run: |
          docker run --rm --network none --read-only --cap-drop ALL --tmpfs /tmp --workdir /tmp \
            -e ROS_LOCALHOST_ONLY=1 -e ROS_LOG_DIR=/tmp/ros-log geminidepthport-native-yuyv:ci \
            python3 /opt/geminidepthport/tests/ros_native_yuyv_smoke.py
          docker run --rm --network none --read-only --cap-drop ALL --tmpfs /tmp --workdir /tmp \
            geminidepthport-native-yuyv:ci /opt/native-yuyv-sdk-test
