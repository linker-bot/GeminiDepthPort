[package]
name = "quality-core"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
description = "Bounded capture-quality episodes, monotonic staleness and cursor queries"

[dependencies]
capture-contract = { path = "../capture-contract" }
serde = { version = "1.0", features = ["derive"] }

[dev-dependencies]
serde_json = { version = "1.0", features = ["float_roundtrip"] }
