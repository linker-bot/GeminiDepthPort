[workspace]
members = ["crates/capture-contract", "crates/quality-core", "crates/capture-observer", "crates/frame-core", "crates/orbbec-sys", "crates/orbbec-safe", "crates/capture-probe", "crates/ros-output", "crates/d2c-core", "crates/depth-output", "crates/offline-depth"]
resolver = "3"

[package]
name = "geminidepthport"
default-run = "geminidepthport"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
description = "GeminiDepthPort host management service and CLI"

[dependencies]
capture-contract = { path = "crates/capture-contract" }
capture-observer = { path = "crates/capture-observer" }
quality-core = { path = "crates/quality-core" }
anyhow = "1.0"
libc = "0.2"
regex = "1.12"
ring = "0.17"
serde_json = { version = "1.0", features = ["float_roundtrip"] }
subtle = "2.6"
tempfile = "3.27"
tiny_http = "0.12"
url = "2.5"

[profile.release]
lto = "thin"
strip = true
